<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma Onboarding</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f7f7fa; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 16px #0001; padding: 32px 24px; }
        h1 { text-align: center; color: #4a4a8a; }
        .question { margin: 24px 0 12px 0; font-weight: 500; }
        .options, .checkboxes { margin-bottom: 16px; }
        .options label, .checkboxes label { display: block; margin-bottom: 6px; }
        .checkboxes input[type=checkbox] { margin-right: 8px; }
        .submit-btn { width: 100%; background: #4a4a8a; color: #fff; border: none; border-radius: 6px; padding: 12px; font-size: 1.1em; cursor: pointer; margin-top: 20px; }
        .submit-btn:hover { background: #36366a; }
        .footer { text-align: center; color: #888; margin-top: 32px; font-size: 0.95em; }
        .other-input { margin-top: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Luma — Your AI Life Coach</h1>
        <form id="onboardingForm">
            <div class="question">Q1: What's your main role?</div>
            <div class="options">
                <label><input type="radio" name="role" value="Student" required> Student</label>
                <label><input type="radio" name="role" value="Remote worker"> Remote worker</label>
                <label><input type="radio" name="role" value="Office worker"> Office worker</label>
                <label><input type="radio" name="role" value="Freelancer"> Freelancer</label>
                <label><input type="radio" name="role" value="Other" id="roleOtherRadio"> Other:</label>
                <input type="text" id="roleOtherInput" class="other-input" name="role_other" placeholder="Please specify" style="display:none;">
            </div>

            <div class="question">Q2: What are your 3 non-negotiables?</div>
            <div class="checkboxes">
                <label><input type="checkbox" name="nonneg" value="Prayer / Meditation"> Prayer / Meditation</label>
                <label><input type="checkbox" name="nonneg" value="Exercise / Movement"> Exercise / Movement</label>
                <label><input type="checkbox" name="nonneg" value="7+ hours sleep"> 7+ hours sleep</label>
                <label><input type="checkbox" name="nonneg" value="Breakfast"> Breakfast</label>
                <label><input type="checkbox" name="nonneg" value="Study / Learning time"> Study / Learning time</label>
                <label><input type="checkbox" name="nonneg" value="Social time"> Social time</label>
                <label><input type="checkbox" name="nonneg" value="Creative time"> Creative time</label>
            </div>

            <div class="question">Q3: When are you most productive?</div>
            <div class="options">
                <label><input type="radio" name="productive" value="Early morning (5-8 AM)" required> Early morning (5-8 AM)</label>
                <label><input type="radio" name="productive" value="Morning (8 AM-12 PM)"> Morning (8 AM-12 PM)</label>
                <label><input type="radio" name="productive" value="Afternoon (12-4 PM)"> Afternoon (12-4 PM)</label>
                <label><input type="radio" name="productive" value="Evening (4-8 PM)"> Evening (4-8 PM)</label>
                <label><input type="radio" name="productive" value="Night (8 PM+)"> Night (8 PM+)</label>
            </div>

            <div class="question">Q4: What's your biggest productivity killer?</div>
            <div class="options">
                <label><input type="radio" name="killer" value="Not enough sleep" required> Not enough sleep</label>
                <label><input type="radio" name="killer" value="Procrastination"> Procrastination</label>
                <label><input type="radio" name="killer" value="Too many tasks"> Too many tasks</label>
                <label><input type="radio" name="killer" value="Distractions"> Distractions</label>
                <label><input type="radio" name="killer" value="Stress / Anxiety"> Stress / Anxiety</label>
                <label><input type="radio" name="killer" value="Low mood"> Low mood</label>
            </div>

            <div class="question">Q5: How should Luma help you?</div>
            <div class="options">
                <label><input type="radio" name="style" value="Honest & direct" required> Honest & direct</label>
                <label><input type="radio" name="style" value="Gentle & supportive"> Gentle & supportive</label>
                <label><input type="radio" name="style" value="Motivational & pumped up"> Motivational & pumped up</label>
                <label><input type="radio" name="style" value="Mix it based on my mood"> Mix it based on my mood</label>
            </div>

            <div class="question">Q6: What's your name?</div>
            <input type="text" name="name" placeholder="Your name" required style="width:100%;padding:8px;margin-bottom:16px;">

            <button type="submit" class="submit-btn">✓ Done! Ready to start</button>
        </form>
        <div class="footer">
            Chat with Luma daily. I'll learn your patterns.<br>
            <span style="font-size:0.9em;">&copy; 2026 Luma AI</span>
        </div>
    </div>
    <script>
        // Show/hide 'Other' input for role
        document.getElementById('roleOtherRadio').addEventListener('change', function() {
            document.getElementById('roleOtherInput').style.display = this.checked ? 'block' : 'none';
        });
        document.querySelectorAll('input[name="role"]').forEach(function(radio) {
            radio.addEventListener('change', function() {
                if(this.value !== 'Other') {
                    document.getElementById('roleOtherInput').style.display = 'none';
                }
            });
        });
        // Limit non-negotiables to 3
        const nonnegChecks = document.querySelectorAll('input[name="nonneg"]');
        nonnegChecks.forEach(function(box) {
            box.addEventListener('change', function() {
                let checked = Array.from(nonnegChecks).filter(b => b.checked);
                if(checked.length > 3) {
                    this.checked = false;
                    alert('Pick up to 3 non-negotiables.');
                }
            });
        });
        // Handle form submit to FastAPI backend
        document.getElementById('onboardingForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Gather data from form
            let role = document.querySelector('input[name="role"]:checked')?.value || "";
            if (role === 'Other') {
                role = document.getElementById('roleOtherInput').value || 'Other';
            }
            
            const nonnegChecks = document.querySelectorAll('input[name="nonneg"]:checked');
            const non_negotiables = Array.from(nonnegChecks).map(cb => cb.value);
            
            const productive_time = document.querySelector('input[name="productive"]:checked')?.value || "";
            const killer = document.querySelector('input[name="killer"]:checked')?.value || "";
            const style = document.querySelector('input[name="style"]:checked')?.value || "";
            const name = document.querySelector('input[name="name"]')?.value || "";
            
            const payload = {
                role: role,
                non_negotiables: non_negotiables,
                productive_time: productive_time,
                killer: killer,
                style: style,
                name: name
            };
            
            try {
                const response = await fetch("http://127.0.0.1:8000/onboarding", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(payload),
                });
                
                if (response.ok) {
                    alert('Thank you! Your answers have been successfully saved to the backend onboarding file.');
                } else {
                    alert('Failed to save to backend. Is the server running?');
                }
            } catch(error) {
                alert('Error connecting to backend: ' + error.message);
            }
        });
    </script>
    <script>
        async function sendMessage() {
            const userInput = document.getElementById("userInput").value;
            const responseBox = document.getElementById("responseBox");

            try {
                const response = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ message: userInput }),
                });

                if (!response.ok) {
                    throw new Error("Failed to get response from server");
                }

                const data = await response.json();
                responseBox.innerText = data.response;
            } catch (error) {
                responseBox.innerText = "Error: " + error.message;
            }
        }
    </script>
    <div>
        <input type="text" id="userInput" placeholder="Type your message here...">
        <button onclick="sendMessage()">Send</button>
        <div id="responseBox"></div>
    </div>
</body>
</html>
